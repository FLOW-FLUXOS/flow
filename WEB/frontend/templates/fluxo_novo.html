{% extends "base.html" %}{% load static %}
{% block titulo %}Novo fluxo{% endblock %}
{% block conteudo %}
<div x-data="telaNovoFluxo()" x-init="carregar()">
    <h1><a href="{% url 'fluxos' %}"><img style="width:30px;height:30px;padding-right:3px;" src="{% static 'img/back.png' %}"></a> Criar fluxo</h1>
    <hr>
    <p class="carregando" x-show="carregando">Carregando modelos...</p>
    <p class="vazio" x-show="!carregando && modelos.length === 0" x-cloak>
        Nenhum modelo de fluxo cadastrado.
        <template x-if="usuario.is_admin"><span>Crie um em <a href="{% url 'modelo_novo' %}">Modelos de Fluxo</a>.</span></template>
        <template x-if="!usuario.is_admin"><span>Peça para um administrador criar.</span></template>
    </p>
    <form @submit.prevent="criar()" x-show="!carregando && modelos.length > 0" x-cloak>
        <div class="campo">
            <label>Modelo de fluxo *</label>
            <select x-model.number="modeloId" required>
                <option value="">Selecione...</option>
                <template x-for="m in modelos" :key="m.id"><option :value="m.id" x-text="m.nome"></option></template>
            </select>
        </div>
        <template x-if="modelo">
            <div class="etapa-card" style="max-width:520px;">
                <div class="muted" style="margin-bottom:6px;" x-text="modelo.descricao || 'Etapas deste modelo:'"></div>
                <ol style="margin:0; padding-left:20px;">
                    <template x-for="e in modelo.etapas" :key="e.id">
                        <li><span x-text="e.nome"></span> <span class="muted" x-text="'— ' + (e.setor_detalhe ? e.setor_detalhe.nome : 'qualquer setor') + (e.perfil_aprovador === 'administrador' ? ' (administrador)' : '')"></span></li>
                    </template>
                </ol>
            </div>
        </template>
        <div class="campo"><label>Nome do fluxo *</label><input x-model="nome" placeholder="Ex.: Compra de chapas de aço" required></div>
        <div class="campo"><label>Comentário inicial</label><textarea x-model="comentario" placeholder="Opcional"></textarea></div>
        <p class="erro-campo" x-show="erro" x-text="erro"></p>
        <button class="blue-button" type="submit" :disabled="enviando">Criar fluxo</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script>
function telaNovoFluxo() {
    return {
        modelos: [], modeloId: "", nome: "", comentario: "", erro: "", carregando: true, enviando: false,
        get modelo() { return this.modelos.find((m) => m.id === this.modeloId) || null; },
        async carregar() {
            try { this.modelos = await FLOW.listar("/modelos/"); }
            catch (e) { this.erro = e.message; }
            finally { this.carregando = false; }
        },
        async criar() {
            this.erro = ""; this.enviando = true;
            try {
                const f = await FLOW.v1("/fluxos/", { method: "POST", body: { modelo: this.modeloId, nome: this.nome, comentario: this.comentario } });
                FLOW.avisar(`Fluxo "${f.nome}" criado. Etapa atual: ${f.etapa_atual.nome}.`);
                location.href = `/fluxos/instancias/${f.id}/`;
            } catch (e) { this.erro = e.message; } finally { this.enviando = false; }
        },
    };
}
</script>
{% endblock %}
