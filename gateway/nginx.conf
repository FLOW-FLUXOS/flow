# API Gateway do FLOW: um endereço só (porta 8000) na frente dos três serviços.
#   /api/v1/, /admin/, /api-static/  -> API principal
#   /api/pagamentos/                 -> API de pagamentos (microserviço)
#   todo o resto                     -> Web (front: só telas, os dados vêm das APIs)
upstream flow_api        { server api:8000; }
upstream flow_pagamentos { server pagamentos:8001; }
upstream flow_web        { server frontend:8002; }

server {
    listen 80;
    client_max_body_size 10m;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/pagamentos/ { proxy_pass http://flow_pagamentos; }
    location /api/v1/         { proxy_pass http://flow_api; }
    location /admin/          { proxy_pass http://flow_api; }
    location /api-static/     { proxy_pass http://flow_api; }
    location /                { proxy_pass http://flow_web; }
}
