# API Gateway do FLOW: um endereço só (porta 8000) na frente dos dois serviços.
#   /api/pagamentos/...  -> microserviço de Pagamentos
#   todo o resto         -> API principal + sistema web
upstream flow_web        { server web:8000; }
upstream flow_pagamentos { server pagamentos:8001; }

server {
    listen 80;
    client_max_body_size 10m;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/pagamentos/ {
        proxy_pass http://flow_pagamentos;
    }

    location / {
        proxy_pass http://flow_web;
    }
}
