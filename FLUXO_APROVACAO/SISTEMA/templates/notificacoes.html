{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Notificações</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..800&display=swap');
        .notif { display:block; text-decoration:none; color:white; background:#1f2e3c; border:1px solid #2b3d4f; border-radius:8px; padding:14px 18px; margin-bottom:10px; }
        .notif.nao-lida { border-left:4px solid #2f7df4; }
        .notif small { color:#9fb3c8; }
    </style>
</head>
<body>
    {% include 'sidebar.html' %}
    <div class="main-content">
        <div class="top-bar">
            <h1> <img class="main-img" src="{% static 'img/clock.png' %}"> Notificações</h1>
            {% if notificacoes_nao_lidas %}
            <form method="post" action="{% url 'ler_todas_notificacoes' %}">
                {% csrf_token %}
                <button type="submit" class="right-top-button">Marcar todas como lidas</button>
            </form>
            {% endif %}
        </div>
        <hr>
        {% for n in notificacoes %}
            <a class="notif {% if not n.lida %}nao-lida{% endif %}" href="{% url 'abrir_notificacao' n.id %}">
                <strong>{{ n.titulo }}</strong><br>
                {{ n.mensagem }}<br>
                <small>{{ n.criado_em|date:"d/m/Y H:i" }}</small>
            </a>
        {% empty %}
            <p>Nenhuma notificação.</p>
        {% endfor %}
    </div>
</body>
</html>
